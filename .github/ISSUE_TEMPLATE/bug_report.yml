name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first, and never
        paste API keys, tokens, or other secrets into this report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 130
  - type: dropdown
    id: launch
    attributes:
      label: Launch method
      options:
        - llm-dash start
        - llm-dash start --silent
        - installer (install.sh / install.bat)
        - release archive
        - other
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Relevant output from logs/ or screenshots. Redact any secrets.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional Context
