<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM-Dash</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="vendor/uPlot.min.css" />
  <link rel="stylesheet" href="vendor/voidware/index.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/uPlot.iife.min.js"></script>
</head>
<body>
  <a class="vw-skip-link" href="#content">Skip to dashboard</a>
  <div class="vw-page-bg" aria-hidden="true"></div>
  <div class="vw-page-noise" aria-hidden="true"></div>

  <main id="app" class="llm-app vw-page-shell" data-booting="true">
    <header id="mobile-header" class="mobile-shell-header" aria-label="Mobile navigation">
      <button id="sidebar-toggle" class="vw-btn vw-btn-icon" type="button" aria-controls="sidebar" aria-expanded="false">
        <span aria-hidden="true">Menu</span>
        <span class="sr-only">Open navigation</span>
      </button>
      <div>
        <p class="shell-kicker">LLM-Dash</p>
        <p class="shell-mobile-title">Models</p>
      </div>
    </header>

    <button id="sidebar-backdrop" class="vw-sidebar-backdrop" type="button" aria-label="Close navigation"></button>

    <aside id="sidebar" class="vw-sidebar app-sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <p class="shell-kicker">LLM-Dash</p>
        <h1>Model Ops</h1>
        <p>Benchmarks, run history, and local update controls.</p>
      </div>

      <div class="vw-sidebar-section">
        <p class="vw-sidebar-heading">Workspace</p>
        <nav class="vw-sidebar-nav" aria-label="Dashboard areas">
          <button class="vw-sidebar-link view-btn" type="button" data-area="models" data-view="table" aria-pressed="true" aria-current="page">
            <span class="vw-sidebar-icon" aria-hidden="true">M</span>
            <span class="vw-sidebar-label">Models</span>
          </button>
          <button class="vw-sidebar-link view-btn" type="button" data-area="changelog" data-view="changelog" aria-pressed="false">
            <span class="vw-sidebar-icon" aria-hidden="true">L</span>
            <span class="vw-sidebar-label">Changelog</span>
          </button>
          <button class="vw-sidebar-link view-btn" type="button" data-area="stats" data-view="stats" aria-pressed="false">
            <span class="vw-sidebar-icon" aria-hidden="true">S</span>
            <span class="vw-sidebar-label">Stats</span>
          </button>
          <button class="vw-sidebar-link view-btn" type="button" data-area="settings" data-view="data" aria-pressed="false">
            <span class="vw-sidebar-icon" aria-hidden="true">C</span>
            <span class="vw-sidebar-label">Settings</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button id="refresh-trigger" class="vw-btn vw-btn-primary refresh-btn" type="button">
          Refresh
        </button>
        <span id="freshness" class="vw-status-chip freshness-chip" data-state="unknown" title="No update recorded yet">
          No updates yet
        </span>
      </div>
    </aside>

    <section id="content" class="vw-page-content app-content" tabindex="-1" aria-live="polite">
      <header id="page-header" class="app-page-header"></header>
      <nav id="subpage-nav" class="vw-subpage-nav" aria-label="Sub-pages">
        <button class="vw-subpage-nav-link view-btn" type="button" data-area="models" data-view="table" aria-pressed="true" aria-current="page">Table</button>
        <button class="vw-subpage-nav-link view-btn" type="button" data-area="models" data-view="chart" aria-pressed="false">Chart</button>
      </nav>

      <section id="content-body" class="content-slot" aria-live="polite">
        <p class="status-msg">Loading dashboard…</p>
      </section>
    </section>
  </main>
  <div id="overlay-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
